<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Copones BV · Pádel</title>
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Copones BV" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d; --bg2:#121317; --card:#16181d; --card2:#1d2027; --line:#2a2e37;
    --txt:#f4f6fa; --muted:#98a0ad; --red:#e2102a; --red2:#ff3350;
    --A:#f5c518; --B:#2f7bff; --C:#fb923c; --D:#a78bfa;
    --gold:#ffd34d; --spoon:#8a8f99;
    /* 🎨 acentos usados como TEXTO: en oscuro son los mismos; el modo claro los oscurece para que se lean sobre blanco */
    --aT:var(--A); --bT:var(--B); --cT:var(--C); --dT:var(--D); --goldT:var(--gold);
    --okT:#4ade80; --warnT:#ffcf4d; --hotT:#fb923c; --lilaT:#c4b5fd; --sorT:#22c55e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(680px 460px at 6% 3%, rgba(245,197,24,.07), transparent 62%),
      radial-gradient(680px 460px at 94% 8%, rgba(47,123,255,.10), transparent 62%),
      radial-gradient(760px 560px at 88% 94%, rgba(251,146,60,.07), transparent 62%),
      radial-gradient(760px 560px at 10% 90%, rgba(167,139,250,.07), transparent 62%),
      var(--bg);
    background-attachment:fixed;
    color:var(--txt);font-family:"Inter",system-ui,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:46px 46px}
  .ticker,.rainbow,.wrap{position:relative;z-index:1}
  h1,h2,h3,.anton{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
  .cond{font-family:"Barlow Condensed",sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}

  /* Top bar ESPN */
  .top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#000,#0a0b0d);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:4px max(14px,env(safe-area-inset-right)) 4px max(14px,env(safe-area-inset-left))}
  .brandmark{background:linear-gradient(135deg,var(--red),var(--C) 90%);color:#fff;font-family:"Anton";font-size:18px;padding:4px 9px;border-radius:5px;letter-spacing:.02em;line-height:1;box-shadow:0 2px 10px rgba(226,16,42,.35)}
  .brandtxt{font-family:"Anton";font-size:19px;letter-spacing:.02em;line-height:1}
  .brandtxt small{display:block;font-family:"Barlow Condensed";font-weight:600;font-size:11px;letter-spacing:.32em;color:var(--muted)}
  .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:"Barlow Condensed";font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red2);box-shadow:0 0 0 0 rgba(255,51,80,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,51,80,.55)}70%{box-shadow:0 0 0 8px rgba(255,51,80,0)}100%{box-shadow:0 0 0 0 rgba(255,51,80,0)}}

  /* ticker */
  .ticker{background:#000;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
  .ticker .run{display:inline-block;padding:6px 0;font-family:"Barlow Condensed";font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--muted);animation:scroll 26s linear infinite}
  .ticker .run b{color:var(--txt)} .ticker .run .rd{color:var(--red2)}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  section{padding:16px 0 6px}
  .sechead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
  .sechead .bar{width:5px;height:22px;background:linear-gradient(180deg,var(--A),var(--C),var(--red));border-radius:2px}
  .sechead h2{font-size:23px}
  .sechead .sub{margin-left:auto;font-family:"Barlow Condensed";font-weight:600;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card + .card{margin-top:12px}
  .pad{padding:14px}

  /* hero result */
  .hero{background:linear-gradient(135deg,#241a2e,#151019 55%,#101622);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
  .hero:before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;background:radial-gradient(circle,rgba(226,16,42,.28),transparent 70%);pointer-events:none}
  .hero:after{content:"";position:absolute;left:-30px;bottom:-45px;width:150px;height:150px;background:radial-gradient(circle,rgba(47,123,255,.2),transparent 70%);pointer-events:none}
  .hero .lbl{font-family:"Barlow Condensed";font-weight:700;letter-spacing:.16em;font-size:12px;color:var(--red2);text-transform:uppercase}
  .hero .date{font-family:"Barlow Condensed";color:var(--muted);font-size:13px;font-weight:600}
  .champ{display:flex;align-items:center;gap:12px;margin-top:8px}
  .champ .cup{font-size:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
  .champ .names{font-family:"Anton";font-size:26px;line-height:1}
  .champ .names small{display:block;font-family:"Barlow Condensed";font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-top:4px}

  /* stat pills row */
  .pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .pill .n{font-family:"Anton";font-size:30px;line-height:1}
  .pill .k{font-family:"Barlow Condensed";font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:4px}
  .rainbow{height:3px;background:linear-gradient(90deg,var(--A),var(--C),var(--red),var(--D),var(--B))}
  .pills .pill:nth-child(1){border-top:3px solid var(--A)}
  .pills .pill:nth-child(2){border-top:3px solid var(--C)}
  .pills .pill:nth-child(3){border-top:3px solid var(--B)}
  .pills .pill:nth-child(1) .n{color:var(--aT)}
  .pills .pill:nth-child(2) .n{color:var(--cT)}
  .pills .pill:nth-child(3) .n{color:var(--bT)}

  /* tables / standings */
  table{width:100%;border-collapse:collapse}
  .stand th{font-family:"Barlow Condensed";font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
  .stand th:first-child,.stand td:first-child{text-align:left}
  .stand td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}
  .stand tr:last-child td{border-bottom:0}
  .stand tbody tr:nth-child(odd){background:rgba(255,255,255,.015)}
  .stand td:first-child{white-space:nowrap}
  .stand .nm{display:inline-block;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  @media (max-width:480px){ /* celular: que cada jugador entre en una sola línea */
    .stand td,.stand th{padding:9px 4px}
    .stand td:first-child,.stand th:first-child{padding-left:8px}
    .stand .rk{margin-right:6px;width:22px}
    .stand .pname{gap:5px}
    .stand .mvx{font-size:10px}
  }
  .rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--card2);font-family:"Anton";font-size:13px;color:var(--muted);margin-right:9px}
  .rk.g1{background:var(--gold);color:#111}.rk.g2{background:#c9ccd4;color:#111}.rk.g3{background:#cd7f43;color:#111}
  .pname{font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .big{font-family:"Anton";font-size:18px}
  .cA{color:var(--aT)}.cB{color:var(--bT)}.cC{color:var(--cT)}.cD{color:var(--dT)}
  .cchip{display:inline-block;min-width:18px;text-align:center;font-family:"Anton";font-size:11px;padding:1px 5px;border-radius:5px;color:#0a0b0d}
  .chA{background:var(--A)}.chB{background:var(--B);color:#fff}.chC{background:var(--C)}.chD{background:var(--D)}.ch0{background:#3a3f49;color:#aeb4bf}

  /* segmented */
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;margin-bottom:12px}
  .seg button{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent;border:0;color:var(--muted);font-family:"Barlow Condensed";font-weight:700;font-size:15px;letter-spacing:.04em;padding:9px 6px;border-radius:8px;cursor:pointer;text-transform:uppercase}
  .seg button.on{background:var(--red);color:#fff}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;border:0;border-radius:11px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
  .btn.block{width:100%}
  .btn.sm{padding:9px 12px;font-size:13px;border-radius:9px}

  /* jugadores grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .jcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;position:relative;overflow:hidden}
  .jcard .av{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:"Anton";font-size:18px;color:#0a0b0d;margin-bottom:8px}
  .jcard .jn{font-weight:800;font-size:16px;line-height:1.1}
  .jcard .jm{font-family:"Barlow Condensed";font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.04em;margin-top:3px}
  .jcard .jstat{display:flex;gap:12px;margin-top:9px}
  .jcard .jstat div{font-family:"Barlow Condensed"}
  .jcard .jstat b{font-family:"Anton";font-size:17px;display:block;line-height:1}
  .jcard .jstat span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

  /* profile */
  .phead{display:flex;align-items:center;gap:14px}
  .phead .pav{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:"Anton";font-size:28px;color:#0a0b0d}
  img.pav{object-fit:cover;border:1px solid var(--line)}
  .kiagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
  .kiagrid figure{margin:0}
  .kiagrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .kiagrid figcaption{font-family:"Barlow Condensed";font-weight:600;font-size:12px;color:var(--muted);margin-top:3px;text-align:center}
  /* ⚔️ cara a cara: A | dato | B */
  .cmphead,.cmpr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
  .cmphead{margin-bottom:6px}
  .cmphead b{display:block;font-size:15px;margin-top:6px;overflow-wrap:anywhere}
  .cmpav{width:56px;height:56px;border-radius:14px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-family:"Anton";font-size:24px;color:#0a0b0d}
  img.cmpav{display:block;object-fit:cover;border:1px solid var(--line)}
  .cmpvs{font-family:"Anton",Impact,sans-serif;font-size:22px;color:var(--red2)}
  .cmpr{padding:7px 0;border-bottom:1px solid var(--line)}
  .cmpr:last-child{border-bottom:0}
  .cmpr b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:22px;line-height:1.1}
  .cmpr b.w{color:var(--goldT)}
  .cmpr span{font-size:12.5px;color:var(--muted);min-width:104px}
  .cmpr.sm b{font-size:18px}
  .cmpbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
  .cmpbox summary{cursor:pointer;min-height:44px;display:flex;align-items:center;list-style:none} .cmpbox summary::-webkit-details-marker{display:none}
  .cmpbox summary:before{content:"▸";margin-right:6px} .cmpbox details[open] summary:before{content:"▾"}
  .phead .pn{font-family:"Anton";font-size:30px;line-height:1}
  .phead .pm{font-family:"Barlow Condensed";font-weight:600;color:var(--muted);letter-spacing:.06em;margin-top:4px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .row:last-child{border-bottom:0}
  .row .muted{color:var(--muted)}
  .tag{font-family:"Barlow Condensed";font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  /* sorteo */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-family:"Barlow Condensed";font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:16px;font-weight:600}
  input:focus,select:focus{outline:none;border-color:var(--red)}
  #drawMsg,.hero,#prodeCard,#ptDia{scroll-margin-top:calc(64px + env(safe-area-inset-top))} /* que no lo tape la barra de arriba */
  .savebar{margin-top:10px;padding:10px 12px;border:1px solid var(--red);border-radius:12px;background:rgba(226,16,42,.07);color:var(--txt)}
  .savebar .warn{color:var(--red2)} .savebar.ok{border-color:#22c55e;background:rgba(34,197,94,.08)} .savebar.info{border-color:var(--line);background:var(--card2)}
  .pairwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:12px;position:relative}
  .pcard .no{position:absolute;top:9px;right:12px;font-family:"Anton";font-size:20px;color:#3a3f49}
  .pl{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:4px 0}
  .pl.swapable{cursor:pointer;border-radius:8px;padding:4px 6px;margin:0 -6px;transition:.12s}
  .pl.swapable:active{transform:scale(.97)}
  .pl.swapsel{outline:2px dashed var(--A);outline-offset:1px;background:rgba(245,197,24,.12)}
  .amp{color:var(--muted);font-family:"Anton";font-size:15px;padding-left:2px}
  .sortcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
  @media(max-width:700px){.sortcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .sortcol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;border-top:3px solid var(--cc,#444)}
  .co-A{--cc:var(--A);--ccT:var(--aT)}.co-B{--cc:var(--B);--ccT:var(--bT)}.co-C{--cc:var(--C);--ccT:var(--cT)}.co-D{--cc:var(--D);--ccT:var(--dT)}.co-S{--cc:#22c55e;--ccT:var(--sorT)}
  .sortcol .sh{font-family:"Anton";font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;color:var(--ccT,var(--cc,#ccc))}
  .sortcol .sh small{font-family:"Inter";font-weight:700;font-size:11px;color:var(--muted)}
  .ptoggle{display:block;width:100%;text-align:center;background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 6px;margin-bottom:6px;font-weight:700;font-size:13px;cursor:pointer;transition:.12s;font-family:inherit}
  .ptoggle:last-child{margin-bottom:0}
  .ptoggle.on{color:#0a0b0d;border-color:transparent}
  .ptoggle.on.k-A{background:var(--A)}.ptoggle.on.k-B{background:var(--B);color:#fff}.ptoggle.on.k-C{background:var(--C)}.ptoggle.on.k-D{background:var(--D);color:#0a0b0d}.ptoggle.on.k-S{background:#22c55e;color:#0a0b0d}
  .plcols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:820px){.plcols{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:460px){.plcols{grid-template-columns:1fr}}
  .plcol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;border-top:3px solid var(--cc,#444)}
  .plhead{font-family:"Anton";font-size:13px;letter-spacing:.03em;color:var(--ccT,var(--cc,#ccc));margin-bottom:10px;display:flex;align-items:center;gap:7px;text-transform:uppercase}
  .plcard{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .plcard:hover{border-color:var(--cc,#888);transform:translateX(2px)}
  .plcard:last-child{margin-bottom:0}
  .pln{font-weight:800;font-size:14.5px;line-height:1.15}
  .pchamp{color:var(--goldT);font-size:12px;font-weight:700}
  .plr{font-family:"Barlow Condensed";font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.02em;margin-top:2px}
  .pls{font-family:"Barlow Condensed";font-weight:700;color:var(--ccT,var(--cc,#888));font-size:10.5px;margin-top:5px;text-transform:uppercase;letter-spacing:.07em}
  .co-inv{--cc:#7a828f}

  .note{color:var(--muted);font-size:13px;line-height:1.55}
  .warn{color:var(--warnT);font-weight:700}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}

  /* admin list edit */
  .adline{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
  .adline .an{flex:1;font-weight:600}
  .adline select{padding:6px 8px;font-size:13px}
  .adline button{background:transparent;border:0;color:var(--muted);font-size:16px;cursor:pointer}

  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,11,13,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .navin{max-width:720px;margin:0 auto;display:flex;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  /* 📱↔️ iPhone apaisado: desde 800 px el centrado (720) ya deja 40 px a cada lado; el margen del notch no se suma */
  @media(min-width:800px){.wrap,.topin{padding-left:14px;padding-right:14px}.navin{padding:0}}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;color:var(--muted);font-family:"Barlow Condensed";font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .nav a .ic{font-size:19px;line-height:1}
  .nav a.on{color:var(--txt)}
  .nav a.on .ic{filter:drop-shadow(0 0 8px rgba(226,16,42,.8))}
  .nav a.on:after{content:"";position:absolute;top:0;width:26px;height:3px;background:var(--red);border-radius:0 0 3px 3px}
  .nav a{position:relative}
  .navdot{position:absolute;top:3px;left:calc(50% + 8px);background:var(--red2);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 8px rgba(255,51,80,.6);font-family:"Inter",sans-serif}

  .hidden{display:none}

  if(g0!==undefined&&g0!==NUBE_GEN){ volverANube(); render(); avisoTarde(AVISO_PISADA); return Promise.resolve(false); }
  if(SAVEPEND)return SAVEQ; // ya hay un guardado esperando turno: se lleva lo último de DATA

    if(gen!==NUBE_GEN){ volverANube(); render(); toast(AVISO_PISADA,4500); return false; } // llegó otra versión mientras esperaba

async function subirNube(){

      const s=await tx.get(dbRef);
      const v=s.exists()?(s.data().updated||0):null;
      if(v!==base){ ultima=s.exists()?s.data():null; throw new Error("pisada"); }
      tx.set(dbRef,{json,updated:ver,by:USER.email,prev:base});
    });
    CLOUD_VER=ver; CLOUD_JSON=json; if(CLOUDSTATE==="vacia")CLOUDSTATE="ok";

    else{ volverANube(); toast("⚠️ No se pudo guardar en la nube (¿sin señal?): NO quedó guardado. Repetilo",4500); }

function esGenerico(n){ return /^\s*invitad[oa]s?\b/i.test(String(n)); }
function todosLosNombres(){
  const s=new Set(DATA.jugadores.map(j=>j.n));

function allFechas(){ return [...DATA.fechas, ...((DATA.historial||[]).flatMap(t=>t.fechas||[]))].sort((a,b)=>b.f.localeCompare(a.f)); }
// 📅 ¿ya se jugó? Ya pasó, es hoy y ya son las 11 (mismo corte que fechasPendientes) o ya tiene campeón.
// Una fecha sorteada que todavía no se jugó no suma en ninguna estadística (la ven la próxima fecha y el sorteo).
function fechaJugada(f){ const hoy=hoyISO(); return !!f.campeon||f.f<hoy||(f.f===hoy&&new Date().getHours()>=11); }
function fechasJugadas(l){ return (l||DATA.fechas).filter(fechaJugada); }
function eachFechaArr(d){ return [d.fechas||[], ...(((d&&d.historial)||[]).map(t=>t.fechas||[]))]; }
function statsInd(list,conGen){ // conGen: incluir a los genéricos (solo para el perfil del propio "Invitado")
  list=fechasJugadas(list);
  const m={};
  const get=n=>!conGen&&esGenerico(n)?{comp:{}}:(m[n]||(m[n]={n,pj:0,camp:0,pala:0,mvp:0,cafe:0,nocafe:0,cafeReg:0,comp:{}}));
  list.forEach(f=>{
    const enFecha=new Set();
    f.parejas.forEach(team=>{
      team.forEach(n=>enFecha.add(n));
      team.forEach(a=>team.forEach(b=>{ if(a!==b&&(conGen||!esGenerico(b))) get(a).comp[b]=(get(a).comp[b]||0)+1; }));
    });
    enFecha.forEach(n=>get(n).pj++);
    if(f.campeon){f.campeon.forEach(n=>get(n).camp++);}
    if(f.pala){f.pala.forEach(n=>get(n).pala++);}
    if(f.mvp){get(f.mvp).mvp++;}
    // ☕ solo cuenta en fechas donde se registró el dato (sinCafe existe)
    if(Array.isArray(f.sinCafe)){
      enFecha.forEach(n=>{const g=get(n);g.cafeReg++;if(f.sinCafe.includes(n))g.nocafe++;else g.cafe++;});
    }
  });
  return m;
}
function statsPar(list){
  list=fechasJugadas(list);
  const m={};
  list.forEach(f=>{
    f.parejas.forEach(team=>{
      if(team.length!==2||team.some(esGenerico)) return; // "X & Invitado" no es una pareja para rankear
      const [a,b]=team;
      const k=key(a,b); const o=m[k]||(m[k]={a,b,veces:0,camp:0});
      o.veces++;
      if(f.campeon && f.campeon.length===2 && key(f.campeon[0],f.campeon[1])===k) o.camp++;
    });
  });
  return m;
}

function comprimirCanvas(cv){ // que entre en un documento de la nube (l\u00edmite ~1MB)
  let q=.82, url=cv.toDataURL("image/jpeg",q);
  while(url.length>880000&&q>.4){q-=.08;url=cv.toDataURL("image/jpeg",q);}
  if(url.length>880000){
    const k=Math.sqrt(880000/url.length)*.95, c2=document.createElement("canvas");
    c2.width=Math.max(300,Math.round(cv.width*k));c2.height=Math.max(300,Math.round(cv.height*k));
    c2.getContext("2d").drawImage(cv,0,0,c2.width,c2.height);
    url=c2.toDataURL("image/jpeg",.68);
  }
  return url;
}

/* ---------- ◀️ ATRÁS con un modal, una foto o la pantalla gigante: solo cierra eso ---------- */
// Al abrir se agrega una entrada al historial (misma URL): "atrás" la consume y cierra lo de arriba,
// sin cambiar de pantalla (ni salir de la app instalada). Si se cierra tocando, la entrada se consume sola.
let POP_PROPIO=false;
function overlayArriba(){return document.querySelector(".bigshow")||document.getElementById("uimodal")||document.getElementById("fotoview");}
function abrirOverlay(){if(!(history.state&&history.state.ov)){try{history.pushState({ov:1},"");}catch(e){}}}
function alCerrarOverlay(){ // después de cerrar (si no se abrió otro paso del mismo flujo)
  setTimeout(()=>{
    if(!overlayArriba()&&history.state&&history.state.ov){POP_PROPIO=true;history.back();return;} // las novedades, en el popstate (con el historial ya asentado)
    if(PEND_RENDER&&!ocupado())render(); // terminó la acción: ahora sí, las novedades
  },80);
}
window.addEventListener("popstate",()=>{
  if(POP_PROPIO){POP_PROPIO=false;if(overlayArriba())abrirOverlay();else if(PEND_RENDER&&!ocupado())render();return;}
  const o=overlayArriba();
  if(!o){if(history.state&&history.state.ov){POP_PROPIO=true;history.back();}return;} // entrada vieja: se saltea
  if(o.id==="uimodal"){const x=o.querySelector("[data-mx]");if(x)x.click();else uiClose();} // = tocar la ✕ (el flujo cancela bien)
  else o.click(); // la foto y la pantalla gigante se cierran tocándolas
  if(overlayArriba())abrirOverlay();
});

function cropFlow(aspect,titulo){ // 📸 elegir foto → recortar en un modal → Promise<dataURL|null>
  return new Promise(res=>{
    const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
    let eligio=false;
    inp.onchange=()=>{
      eligio=true;
      const file=inp.files[0]; if(!file){res(null);return;}
      const d=uiShow(esc(titulo||"📸 Encuadrá la foto"),"Arrastrala para acomodarla y ajustá el zoom",`
        <div id="cfFrame" style="position:relative;width:100%;max-width:330px;aspect-ratio:${aspect};overflow:hidden;border-radius:12px;border:2px dashed var(--A);margin:0 auto;touch-action:none;cursor:grab;background:#000">
          <img id="cfImg" alt="" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none" draggable="false">
        </div>
        <div class="field" style="margin-top:8px"><label>Zoom</label><input id="cfZoom" type="range" min="100" max="300" value="100" style="width:100%"></div>
        <button class="mok" data-ok>✓ Usar esta foto</button>
        <button class="mcancel" data-x>Cancelar</button>`);
      const img=d.querySelector("#cfImg"),frame=d.querySelector("#cfFrame"),zoom=d.querySelector("#cfZoom");
      const st={x:0,y:0,scale:1,base:1,iw:0,ih:0};
      const apply=()=>{img.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.scale})`;};
      const clamp=()=>{const fw=frame.clientWidth,fh=frame.clientHeight;
        st.x=Math.min(0,Math.max(fw-st.iw*st.scale,st.x));
        st.y=Math.min(0,Math.max(fh-st.ih*st.scale,st.y));};
      img.onload=()=>{
        st.iw=img.naturalWidth;st.ih=img.naturalHeight;
        const fw=frame.clientWidth,fh=frame.clientHeight;
        st.base=Math.max(fw/st.iw,fh/st.ih);
        st.scale=st.base;st.x=(fw-st.iw*st.base)/2;st.y=(fh-st.ih*st.base)/2;
        apply();
      };
      img.src=URL.createObjectURL(file);
      zoom.oninput=()=>{const fw=frame.clientWidth,fh=frame.clientHeight;
        const ns=st.base*zoom.value/100,cx=fw/2,cy=fh/2;
        st.x=cx-(cx-st.x)*(ns/st.scale);st.y=cy-(cy-st.y)*(ns/st.scale);
        st.scale=ns;clamp();apply();};
      let drag=null;
      frame.addEventListener("pointerdown",e=>{drag={x:e.clientX-st.x,y:e.clientY-st.y};try{frame.setPointerCapture(e.pointerId);}catch(err){}});
      frame.addEventListener("pointermove",e=>{if(!drag)return;st.x=e.clientX-drag.x;st.y=e.clientY-drag.y;clamp();apply();});
      frame.addEventListener("pointerup",()=>drag=null);
      d.querySelector("[data-ok]").onclick=()=>{
        if(!st.iw){toast("Esperá que cargue la foto…");return;}
        const fw=frame.clientWidth,fh=frame.clientHeight;
        const outW=900,outH=Math.round(outW*fh/fw),k=outW/fw;
        const cv=document.createElement("canvas");cv.width=outW;cv.height=outH;
        cv.getContext("2d").drawImage(img,st.x*k,st.y*k,st.iw*st.scale*k,st.ih*st.scale*k);
        uiClose();res(comprimirCanvas(cv));
      };
      d.querySelector("[data-x]").onclick=()=>{uiClose();res(null);};
    };
    // si cierra el selector de archivos sin elegir nada, no queda colgada la promesa
    window.addEventListener("focus",()=>setTimeout(()=>{if(!eligio)res(null);},900),{once:true});
    inp.click();
  });
}

function miniRank(list,field){
  if(!list.length||!list.some(x=>x[field]))return `<div class="empty" style="padding:12px">Sin datos todavía</div>`;
  return `<table class="stand"><tbody>${list.map((p,i)=>`
    <tr data-perfil="${esc(p.n)}"><td><span class="rk ${i<3?'g'+(i+1):''}">${i+1}</span><span class="pname">${chip(p.n)} ${esc(p.n)}</span></td>
    <td style="text-align:right"><span class="big">${p[field]}</span></td></tr>`).join("")}</tbody></table>`;
}
function chip(n){const c=coponDe(n);return `<span class="cchip ${COL[c]||"ch0"}">${esc(c||"·")}</span>`;}

/* ---------- RANKING ---------- */
let RKTAB="jug", RKSEASON="actual";
function seasonFechas(){
  if(RKSEASON==="todas")return allFechas();
  if(RKSEASON.startsWith("h")){const t=(DATA.historial||[])[+RKSEASON.slice(1)];return t?t.fechas:DATA.fechas;}
  return DATA.fechas;
}
function vRanking(){
  const hist=DATA.historial||[];
  return `<section>
    <div class="sechead"><span class="bar"></span><h2>Ranking</h2><span class="sub">${RKSEASON==="actual"?"Temporada en curso":RKSEASON==="todas"?"Histórico total":esc((hist[+RKSEASON.slice(1)]||{}).nombre||"")}</span></div>
    ${hist.length?`<select id="rkseason" style="width:100%;margin-bottom:10px">
      <option value="actual" ${RKSEASON==="actual"?"selected":""}>🎾 Temporada en curso</option>
      ${hist.map((t,i)=>`<option value="h${i}" ${RKSEASON==="h"+i?"selected":""}>🏁 ${esc(t.nombre)}</option>`).join("")}
      <option value="todas" ${RKSEASON==="todas"?"selected":""}>📚 Histórico total</option>
    </select>`:""}
    <div class="seg" id="rkseg">
      <button data-t="jug" class="${RKTAB==='jug'?'on':''}">Jugadores</button>
      <button data-t="par" class="${RKTAB==='par'?'on':''}">Parejas</button>
      <button data-t="partidos" class="${RKTAB==='partidos'?'on':''}">🎾 Partidos</button>
      <button data-t="prode" class="${RKTAB==='prode'?'on':''}">🎲 Adivinos</button>
    </div>
    <div class="card" id="rktable">${tablaRK()}</div>
    <div class="note" id="rknota" style="margin-top:10px"${RKTAB==="jug"?"":" hidden"}>PJ = fechas jugadas · 🚗 = Kias (campeonatos) · 🎖️ = MVP del día · 🥄 = cucharas de madera · ☕ = se quedó al café · 🏃 = se rajó sin café. Orden: más 🚗; a igualdad, más PJ; si siguen iguales, comparten puesto. «Invitado» no se rankea (la fecha le cuenta al compañero). Tocá un nombre para ver su perfil.</div>
  </section>`;
}
function tablaRK(){ return RKTAB==='jug'?tablaJug():RKTAB==='par'?tablaPar():RKTAB==='partidos'?tablaPartidos():tablaProde(); } // 🎾 Partidos va aparte: no toca la de Jugadores
// 🏅 puesto compartido: los empates exactos llevan el mismo número (1, 2, 2, 4…) sin tocar el orden
function puestos(arr,cmp){ const r=[]; arr.forEach((x,i)=>r.push(i&&!cmp(arr[i-1],x)?r[i-1]:i+1)); return r; }
function tablaJug(){
  const orden=(a,b)=>b.camp-a.camp||b.pj-a.pj;
  const arr=Object.values(statsInd(seasonFechas())).sort(orden), pu=puestos(arr,orden);
  if(!arr.length)return `<div class="empty">Sin datos</div>`;
  // 📈 movimiento vs. la semana pasada: puesto de hoy contra el de antes de la última fecha JUGADA
  const prevPos={}, jug=fechasJugadas();
  if(RKSEASON==="actual"&&jug.length>1){
    const prev=Object.values(statsInd(jug.slice(1))).sort(orden), pp=puestos(prev,orden);
    prev.forEach((p,i)=>prevPos[p.n]=pp[i]);
  }
  const mv=(n,i)=>{
    if(RKSEASON!=="actual")return "";
    if(prevPos[n]===undefined)return ' <small class="mvx" style="color:var(--okT);font-weight:800">🆕</small>';
    const d=prevPos[n]-pu[i];
    if(d>0)return ` <small class="mvx" style="color:var(--okT);font-weight:800">▲${d}</small>`;
    if(d<0)return ` <small class="mvx" style="color:var(--red2);font-weight:800">▼${-d}</small>`;
    return ' <small class="mvx" style="color:var(--muted)">=</small>';
  };
  return `<table class="stand"><thead><tr><th>Jugador</th><th>PJ</th><th>🚗</th><th>🎖️</th><th>🥄</th><th>☕</th><th>🏃</th></tr></thead><tbody>
    ${arr.map((p,i)=>`<tr data-perfil="${esc(p.n)}">
      <td><span class="rk ${pu[i]<=3?'g'+pu[i]:''}">${pu[i]}</span><span class="pname">${chip(p.n)} <span class="nm">${esc(p.n)}</span></span>${mv(p.n,i)}</td>
      <td style="text-align:right"><span class="big">${p.pj}</span></td>
      <td style="text-align:right;color:var(--goldT);font-weight:800">${p.camp||"·"}</td>
      <td style="text-align:right;color:var(--aT);font-weight:800">${p.mvp||"·"}</td>
      <td style="text-align:right;color:var(--spoon)">${p.pala||"·"}</td>
      <td style="text-align:right;color:var(--okT);font-weight:800">${p.cafe||"·"}</td>
      <td style="text-align:right;color:var(--red2);font-weight:800">${p.nocafe||"·"}</td>
    </tr>`).join("")}
  </tbody></table>`;
}
function tablaPar(){
  const orden=(a,b)=>b.camp-a.camp||b.veces-a.veces;
  const arr=Object.values(statsPar(seasonFechas())).sort(orden), pu=puestos(arr,orden);
  if(!arr.length)return `<div class="empty">Sin datos</div>`;
  return `<table class="stand"><thead><tr><th>Pareja</th><th>Veces</th><th>🏆</th></tr></thead><tbody>
    ${arr.slice(0,40).map((p,i)=>`<tr>
      <td><span class="rk ${pu[i]<=3?'g'+pu[i]:''}">${pu[i]}</span> <b>${esc(p.a)}</b> <span class="amp">&</span> <b>${esc(p.b)}</b></td>
      <td style="text-align:right"><span class="big">${p.veces}</span></td>
      <td style="text-align:right;color:var(--goldT);font-weight:800">${p.camp||"·"}</td>
    </tr>`).join("")}
  </tbody></table>`;
}

function plcardHTML(n,real,s,sec){

function copName(c){return c?("Copón "+esc(c)):"Invitado/otro";}

/* ---------- SORPRESAS Y UNIR JUGADORES ---------- */
function looseNames(){ // nombres que aparecen en fechas pero no están en el plantel
  const roster=new Set(DATA.jugadores.map(j=>j.n));
  const s=new Set((DATA.bolsa||[]).filter(n=>!roster.has(n)));
  DATA.fechas.forEach(f=>{
    f.parejas.forEach(t=>t.forEach(n=>{if(!roster.has(n))s.add(n);}));
    if(f.mvp&&!roster.has(f.mvp))s.add(f.mvp);
  });
  return [...s].sort((a,b)=>a.localeCompare(b));
}
function allKnownNames(){
  const s=new Set(DATA.jugadores.map(j=>j.n));
  looseNames().forEach(n=>s.add(n));
  return [...s].sort((a,b)=>a.localeCompare(b));
}
// 🔁 el nombre de HOY de alguien que se renombró o se unió (su nombre viejo quedó de apodo). Es para lo que vive
// afuera de los datos (vínculo ⭐, prode, asistencia): cada uno escribe solo lo suyo y el admin no lo puede corregir.
function nombreVivos(){ const s=new Set(allKnownNames()); (DATA.historial||[]).forEach(t=>(t.fechas||[]).forEach(f=>((f&&f.parejas)||[]).forEach(p=>Array.isArray(p)&&p.forEach(n=>s.add(n))))); return s; } // plantel + todo el que jugó (temporadas cerradas incluidas)
function nombreActualFn(){
  const vivos=nombreVivos(), memo={};
  return n=>{ if(!n||vivos.has(n))return n; if(n in memo)return memo[n];
    const q=normName(n), j=q&&DATA.jugadores.find(j=>(j.real||"").split("·").some(a=>normName(a)===q));
    return memo[n]=j?j.n:n; };
}
function nombreActual(n){ return !n||DATA.jugadores.some(j=>j.n===n)?n:nombreActualFn()(n); }
function sorpresasSorteo(){ const s=looseNames(); Object.keys(SORP_LOCAL).forEach(n=>{if(!s.includes(n))s.push(n);}); return s; } // + las que sumó un no admin en este celu
function fechasDe(n){return DATA.fechas.filter(f=>f.parejas.some(t=>t.includes(n))).length;}

/* ---------- LECTOR DE LISTAS DE WHATSAPP ---------- */
const RX_ACENTOS=new RegExp("["+String.fromCharCode(0x0300)+"-"+String.fromCharCode(0x036f)+"]","g");
const RX_INVISIBLES=new RegExp("["+String.fromCharCode(0x200b)+"-"+String.fromCharCode(0x200f)+String.fromCharCode(0x2060)+"-"+String.fromCharCode(0x2063)+String.fromCharCode(0xfeff)+String.fromCharCode(0x00a0)+"]","g");
function nombreMal(n){ return n.length>60?"⚠️ Ese nombre es muy largo (hasta 60 letras)":n.includes("|")?"⚠️ El nombre no puede llevar «|»":""; } // como en los partidos y las reglas: si no, sus partidos quedarían raros
function normName(s){return String(s).toLowerCase().normalize("NFD").replace(RX_ACENTOS,"").replace(/[^a-z0-9]/g,"");}
function lev1(a,b){ // ¿difieren en una sola letra? (tolerancia de tipeo)
  if(a===b)return true;
  if(Math.abs(a.length-b.length)>1)return false;
  let i=0,j=0,ed=0;
  while(i<a.length&&j<b.length){
    if(a[i]===b[j]){i++;j++;continue;}
    ed++; if(ed>1)return false;
    if(a.length>b.length)i++; else if(b.length>a.length)j++; else{i++;j++;}
  }
  return ed+(a.length-i)+(b.length-j)<=1;
}
const PALABRA_GENERICA=/^(invitad[oa]s?|sorpresas?)$/; // comodines: ni el nombre ni los apodos de un jugador se quedan con "Invitado" o "Sorpresa"
function playerTokens(j){
  const t=new Set([normName(j.n)]), suma=w=>{const nw=normName(w);if(w.length>2&&!PALABRA_GENERICA.test(nw))t.add(nw);};
  j.n.split(/[\s()\/·]+/).forEach(suma);
  (j.real||"").split("·").forEach(a=>{const na=normName(a);if(na&&!PALABRA_GENERICA.test(na))t.add(na);a.split(/\s+/).forEach(suma);});
  return t;
}
const EMOJI_APODOS=[[/🐈|🐱|😺/u,"gato"]]; // apodos que el grupo escribe con emoji (ej: "7. 🐈" = Gato)
function matchPlayer(raw){
  const em=EMOJI_APODOS.find(([rx])=>rx.test(String(raw)));
  const q=normName(raw)||(em?em[1]:""); if(!q||q.length<2)return null;
  // 1º: coincidencia exacta (nombre o apodo)
  for(const j of DATA.jugadores){ if(playerTokens(j).has(q)) return j.n; }
  for(const n of looseNames()){ if(normName(n)===q) return n; }
  // 2º: tolerancia de una letra (Emma≈Ema), solo si apunta a UN jugador: "Chicho" no puede volverse "Chico" sin avisar.
  //    Primero contra los nombres (plantel + sorpresas) y recién después contra los apodos del perfil.
  if(q.length>=3){
    const unico=pares=>{ const c=new Set(pares.filter(([t])=>t.length>=3&&lev1(t,q)).map(([,n])=>n)); return c.size===1?[...c][0]:(c.size>1?false:null); };
    const nombres=[...DATA.jugadores.flatMap(j=>[normName(j.n),...j.n.split(/[\s()\/·]+/).filter(w=>w.length>2).map(normName).filter(w=>!PALABRA_GENERICA.test(w))].map(t=>[t,j.n])),...looseNames().map(n=>[normName(n),n])];
    const r1=unico(nombres); if(r1!==null) return r1||null;
    const r2=unico(DATA.jugadores.flatMap(j=>[...playerTokens(j)].map(t=>[t,j.n]))); if(r2) return r2;
  }
  return null;
}
function cleanLine(l){
  return String(l).replace(RX_INVISIBLES," ")
    .replace(/^\s*\d+\s*[\.\)\-–—]?\s*/,"")
    .replace(/\(\*+\)|\*+/g,"")
    .replace(/[✅🎾🥎👍✔️]/gu,"") // con "u": sin ella parte los emojis a la mitad (🐈 quedaba roto)
    .trim();
}
function esEncabezado(l){ return !l || /^(domingo|sabado|sábado|lista|convocados|padel|pádel)/i.test(l) || /\d{1,2}\/\d{1,2}/.test(l) || (!/[a-záéíóúñ]/i.test(l)&&!EMOJI_APODOS.some(([rx])=>rx.test(l))); }

/* ---------- CARGA RÁPIDA DE RESULTADO (admin) ---------- */
function faltantesDe(f){ // qué datos le faltan a una fecha ("nadie" se guarda como false, así no se vuelve a preguntar)
  const faltan=[];
  if(!f.campeon)faltan.push("campeon");
  if(f.pala===undefined||f.pala===null)faltan.push("pala");
  if(f.mvp===undefined||f.mvp===null)faltan.push("mvp");
  if(f.sinCafe===undefined||f.sinCafe===null)faltan.push("cafe"); // sinCafe=false: "🤷 no se sabe" (cerrado sin dato; las estadísticas solo cuentan arrays)
  return faltan;
}
const misma=(a,b)=>Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&[...a].sort().join("|")===[...b].sort().join("|"); // misma pareja, en cualquier orden
const NOMDATO={campeon:"🚗 Kia",pala:"🥄 Cuchara",mvp:"🎖️ MVP",sinCafe:"☕ Café"};
function valorTxt(k,v){ // un dato de la fecha, en palabras (texto plano: escapar al usarlo)
  if(v===undefined||v===null)return "sin cargar";
  if(k==="sinCafe")return v===false?"no se sabe":Array.isArray(v)?(v.length?"se rajaron "+v.join(", "):"se quedaron todos"):String(v);
  if(v===false)return "nadie";
  return Array.isArray(v)?v.join(" & "):String(v);
}
function faltantesTxt(f){
  const nom={campeon:"🚗 campeón",pala:"🥄 cuchara",mvp:"🎖️ MVP",cafe:"☕ café"};
  return faltantesDe(f).map(k=>nom[k]).join(" · ");
}
function fechasPendientes(){ // fechas jugadas con datos sin cargar (la de HOY cuenta desde las 11, ya terminaron de jugar).
  // Solo los últimos 3 meses: lo más viejo ya no se puede reconstruir y no tiene sentido insistir.
  const h=new Date(), dd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const hoyS=dd(h), desde=dd(new Date(h.getTime()-90*86400000));
  return DATA.fechas.filter(x=>x.f>=desde&&(x.f<hoyS||(x.f===hoyS&&h.getHours()>=11))&&faltantesDe(x).length);
}
function fechaPendiente(){ return fechasPendientes()[0]||null; }
/* ☁️ La nube puede reemplazar DATA con un modal abierto: al guardar se vuelve a buscar la fecha
   en los datos de AHORA, por identidad o por día + parejas (nunca por índice ni referencia vieja). */
function fechaActual(f){
  if(!f)return null;
  if(DATA.fechas.includes(f))return f;
  const k=JSON.stringify(f.parejas);
  return DATA.fechas.find(x=>x.f===f.f&&JSON.stringify(x.parejas)===k)||null;
}
const CAMBIO_FECHA="⚠️ Esa fecha cambió en la nube mientras tanto (otro admin le tocó las parejas o la borró): NO se guardó. Abrila de nuevo";
const estadoDe=f=>({campeon:f.campeon||null,pala:(f.pala===undefined?null:f.pala),mvp:(f.mvp===undefined?null:f.mvp),sinCafe:Array.isArray(f.sinCafe)?f.sinCafe.slice():(f.sinCafe===false?false:null)});
const normDato=v=>v===undefined?null:Array.isArray(v)?[...v].sort():v; // parejas y café, sin importar el orden
const mismoDato=(a,b)=>JSON.stringify(normDato(a))===JSON.stringify(normDato(b));
async function cargarResultado(f){
  // 📝 TODO EN UNA SOLA PANTALLA: campeón, cuchara, MVP y café juntos.
  // Se ve lo ya cargado, se toca solo lo que cambia y se guarda una única vez.

    mvp:(f.mvp===undefined?null:f.mvp),

  };
  let palaAuto=false; // con 2 parejas la cuchara se propone sola (la otra), y se puede cambiar
  if(f.parejas.length===2&&est.pala===null&&f.parejas.some(t=>misma(t,est.campeon))){est.pala=f.parejas.find(t=>!misma(t,est.campeon));palaAuto=true;}
  const parejasBtns=g=>f.parejas.map((p,i)=>`<button class="mopt" data-g="${g}" data-v="${i}">${i+1}) ${esc(p.join(" & "))}</button>`).join("");
  const d=uiShow(`📝 Resultado del ${fmtFecha(f.f)}`,`Está todo junto: tocá lo que quieras cargar o corregir y guardá una sola vez. Lo que dejes sin marcar queda como "sin cargar".`,`
    <div id="raros"></div>
    <div class="tag" style="margin:6px 0 6px">🚗 ¿Quién se llevó el Kia?</div>
    <div class="mgrid">${parejasBtns("campeon")}</div>
    <div class="tag" style="margin:14px 0 6px">🥄 Cuchara de madera</div>
    <div class="mgrid">${parejasBtns("pala")}<button class="mopt" data-g="pala" data-v="nadie">🤷 Nadie / no hubo</button></div>
    <div class="note hidden" id="palaAuto" style="margin-top:6px">🥄 Con 2 parejas, la cuchara es la otra: ya quedó marcada (tocá otra opción si no fue así).</div>
    <div class="tag" style="margin:14px 0 6px">🎖️ MVP del día</div>
    <div class="mgrid">${jugadores.map(n=>`<button class="mopt" data-g="mvp" data-v="j:${esc(n)}">${esc(n)}</button>`).join("")}<button class="mopt" data-g="mvp" data-v="nadie">🤷 Nadie / no hubo</button></div>
    <div class="tag" style="margin:14px 0 6px">☕ Café</div>
    <div id="cafeZona"></div>
    <button class="mok" data-ok style="margin-top:14px">💾 Guardar todo</button>
    <button class="mcancel" data-x>Cancelar (no guarda nada)</button>`);
  const paint=()=>{
    d.querySelectorAll('[data-g="campeon"]').forEach(b=>b.classList.toggle("on",misma(f.parejas[+b.dataset.v],est.campeon)));
    d.querySelectorAll('[data-g="pala"]').forEach(b=>{

      b.disabled=camp; b.style.opacity=camp?".35":""; b.title=camp?"Es la pareja campeona":"";
      b.classList.toggle("on",b.dataset.v==="nadie"?est.pala===false:misma(f.parejas[+b.dataset.v],est.pala));

    // lo cargado que no es de esta fecha (datos viejos) se muestra, para que no parezca "sin cargar"

    const raros=[["campeon",Array.isArray(est.campeon)&&!f.parejas.some(t=>misma(t,est.campeon))],["pala",Array.isArray(est.pala)&&!f.parejas.some(t=>misma(t,est.pala))&&!(est.pala.length===1&&jugadores.includes(est.pala[0]))],["mvp",typeof est.mvp==="string"&&!jugadores.includes(est.mvp)]].filter(r=>r[1]);

    const cz=d.querySelector("#cafeZona");

        <div class="mgrid">${jugadores.map(n=>`<button class="mopt ${est.sinCafe.has(n)?"on":""}" data-cafe="${esc(n)}">${est.sinCafe.has(n)?"🏃":"☕"} ${esc(n)}</button>`).join("")}</div>

      if(misma(nuevo.campeon,nuevo.pala)){toast("⚠️ El Kia y la cuchara no pueden ser la misma pareja");return;}
      const camb=Object.keys(nuevo).filter(k=>!mismoDato(nuevo[k],antes[k])); // solo lo que tocaste
      uiClose();
      if(!camb.length){toast("No cambiaste nada — quedó todo como estaba");res(false);return;}
      const pisa=camb.filter(k=>antes[k]!==null); // cambia algo que YA estaba cargado: se confirma y queda en el historial
      if(pisa.length&&!completa){ // (si estaba completa ya pasó por el "¡Momento!")
        if(!await uiConfirm("🕰️ Estás corrigiendo lo que ya estaba cargado",`${pisa.map(k=>`${NOMDATO[k]}: <b>${esc(valorTxt(k,antes[k]))}</b> → <b>${esc(valorTxt(k,nuevo[k]))}</b>`).join("<br>")}<br><br>Lo de antes queda guardado en el historial de cambios 🕓, con fecha y autor.`,"✍️ Sí, corregir","Cancelar (no guarda nada)")){toast("No se guardó nada");res(false);return;}
      }
      let cur=fechaActual(f); // la nube pudo cambiar con el modal abierto: se escribe en ESTA fecha de los datos de ahora
      if(!cur){toast(CAMBIO_FECHA,5000);render();res(false);return;}
      const ahora=estadoDe(cur), choques=camb.filter(k=>!mismoDato(ahora[k],antes[k])&&!mismoDato(ahora[k],nuevo[k]));
      if(choques.length){ // otro admin cargó ESO MISMO mientras tanto: decidís vos
        if(!await uiConfirm("⚠️ Otro admin cargó esta fecha recién",`Mientras tenías esto abierto, en la nube cambió <b>${choques.map(k=>NOMDATO[k]).join(" · ")}</b> del ${fmtFecha(cur.f)}.<br><br>¿Guardás lo tuyo encima? Lo que había queda en el historial de cambios.`,"✍️ Sí, guardar lo mío","No, dejar lo de la nube")){toast("No se guardó: quedó lo de la nube");render();res(false);return;}
        cur=fechaActual(cur); if(!cur){toast(CAMBIO_FECHA,5000);render();res(false);return;}
      }
      const previo=estadoDe(cur), fin={...previo}; camb.forEach(k=>{fin[k]=nuevo[k];});
      if(misma(fin.campeon,fin.pala)){toast("⚠️ Con lo que hay en la nube, el Kia y la cuchara quedarían iguales: NO se guardó. Abrila de nuevo",5000);render();res(false);return;}
      const corrige=camb.some(k=>previo[k]!==null); // toca un dato que ya tenía valor (aunque la fecha no esté completa) → con respaldo
      camb.forEach(k=>{ if(k==="sinCafe"&&nuevo.sinCafe===null)delete cur.sinCafe; else cur[k]=nuevo[k]; }); // lo que no tocaste queda como está en la nube
      if(corrige)(cur.versiones||(cur.versiones=[])).push({ts:Date.now(),por:(USER&&USER.email)||"admin (este dispositivo)",antes:previo});
      cur.confirmada=true; // la carga directa siempre la hace un admin
      const sv=save();toast(corrige?"🕰️ Corregido — la versión anterior quedó en el historial":"Resultado cargado ✓");render();
      sv.then(res); // las fotos se ofrecen solo si el resultado quedó guardado
    };
    d.querySelector("[data-x]").onclick=()=>{uiClose();res(false);};
  });
  if(guardo)await ofrecerFotos(f); // 📸 con el resultado guardado, la app ofrece cargar las fotos ahí mismo
  return guardo;
}
async function ofrecerFotos(f){ // 📸 después de cargar el resultado: fotos del día, varias si hace falta

function proxDomingo(){ // el domingo del sorteo: hoy si es domingo antes de las 11 (todavía se juega), si no el que viene
  const d=new Date(); d.setDate(d.getDate()+(d.getDay()===0&&d.getHours()>=11?7:(7-d.getDay())%7));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function resumenConvocados(scrollTop){

function mapPartidos(f,fn){ if(Array.isArray(f.partidos))f.partidos.forEach(x=>{if(x&&Array.isArray(x.a))x.a=x.a.map(fn);if(x&&Array.isArray(x.b))x.b=x.b.map(fn);}); } // 🎾 los partidos también pasan al nombre nuevo
function mapQuien(f,fn){ if(f.fotoQuien)Object.keys(f.fotoQuien).forEach(t=>{if(Array.isArray(f.fotoQuien[t]))f.fotoQuien[t]=f.fotoQuien[t].map(fn);}); } // 📸 quién es quién en las fotos
function sumarApodo(j,a){ // el nombre viejo queda de apodo: las listas de WhatsApp y lo guardado afuera (⭐, prode, asistencia) lo siguen reconociendo
  a=String(a||"").trim(); if(!j||!a||a===j.n||esGenerico(a)||PALABRA_GENERICA.test(normName(a)))return;
  if(!(j.real||"").split("·").map(normName).includes(normName(a)))j.real=(j.real?j.real+" · ":"")+a;
}
function mergePlayers(keep,dup){ // solo cambia DATA: guarda el que llama
  if(!keep||!dup||keep===dup)return;
  eachFechaArr(DATA).forEach(arr=>arr.forEach(f=>{
    f.parejas=f.parejas.map(t=>{const r=t.map(n=>n===dup?keep:n);return r.filter((n,i)=>r.indexOf(n)===i);});
    if(f.campeon){f.campeon=f.campeon.map(n=>n===dup?keep:n).filter((n,i,a)=>a.indexOf(n)===i);}
    if(f.pala){f.pala=f.pala.map(n=>n===dup?keep:n).filter((n,i,a)=>a.indexOf(n)===i);}
    if(f.mvp===dup)f.mvp=keep;
    if(f.sinCafe){f.sinCafe=f.sinCafe.map(n=>n===dup?keep:n).filter((n,i,a)=>a.indexOf(n)===i);}
    mapQuien(f,n=>n===dup?keep:n);
    mapPartidos(f,n=>n===dup?keep:n);
  }));
  const kI=DATA.jugadores.findIndex(j=>j.n===keep), dI=DATA.jugadores.findIndex(j=>j.n===dup);
  if(dI>=0&&kI>=0){ const k=DATA.jugadores[kI], d=DATA.jugadores[dI]; // los apodos y el año del duplicado no se pierden
    [dup,...(d.real||"").split("·")].forEach(a=>sumarApodo(k,a)); if(!k.nac&&d.nac)k.nac=d.nac;
    DATA.jugadores.splice(dI,1); }
  else if(dI>=0&&kI<0){DATA.jugadores[dI].n=keep;sumarApodo(DATA.jugadores[dI],dup);}
  else if(kI>=0)sumarApodo(DATA.jugadores[kI],dup);
  if(DATA.bolsa)DATA.bolsa=DATA.bolsa.filter(n=>n!==dup);
  if(DATA.bolsaCop)delete DATA.bolsaCop[dup];
}
function renameInData(d,old,neu){
  (d.jugadores||[]).forEach(j=>{if(j.n===old)j.n=neu;});
  eachFechaArr(d).forEach(arr=>arr.forEach(f=>{
    f.parejas=f.parejas.map(t=>t.map(n=>n===old?neu:n));
    if(f.campeon)f.campeon=f.campeon.map(n=>n===old?neu:n);
    if(f.pala)f.pala=f.pala.map(n=>n===old?neu:n);
    if(f.mvp===old)f.mvp=neu;
    if(f.sinCafe)f.sinCafe=f.sinCafe.map(n=>n===old?neu:n);
    mapQuien(f,n=>n===old?neu:n);
    mapPartidos(f,n=>n===old?neu:n);
  }));
  if(d.bolsa)d.bolsa=d.bolsa.map(n=>n===old?neu:n);
  if(d.bolsaCop&&d.bolsaCop[old]!==undefined){d.bolsaCop[neu]=d.bolsaCop[old];delete d.bolsaCop[old];}
  return d;
}
function normalizeData(d){
  RENOMBRES.forEach(([o,n])=>{ if(d&&d.jugadores&&d.jugadores.some(j=>j.n===o)&&!d.jugadores.some(j=>j.n===n)) renameInData(d,o,n); });
  if(d&&d.jugadores&&d.fechas){
    d.parches=d.parches||[];
    PARCHES.forEach(p=>{ if(d.parches.includes(p.id))return; try{p.aplicar(d);d.parches.push(p.id);PARCHE_PENDIENTE=true;}catch(e){} });
  }
  return d;
}
function guardarParches(){ // un admin con la nube conectada deja los parches guardados para todos
  if(!PARCHE_PENDIENTE||!CLOUD||!ISADMIN||CLOUDSTATE!=="ok")return;
  PARCHE_PENDIENTE=false;
  save();
}

function proxJuego(){ // próximo domingo 8:30 (el de hoy hasta las 11, cuando ya se jugó y pasa a "fecha incompleta"; después, el que viene)

function rachaActualDe(n){ let r=0; for(const f of fechasJugadas()){ if(f.parejas.some(t=>t.includes(n)))r++; else break; } return r; }
function rachaKiasDe(n,desdeF){ // 🔥 Kias consecutivos ganados (cuenta solo fechas con campeón cargado)
  let r=0;
  for(const f of DATA.fechas){
    if(desdeF&&f.f>desdeF)continue;
    if(!f.campeon)continue;
    if(f.campeon.includes(n))r++; else break;
  }
  return r;
}
function rachasTop(){ // rachas vivas (jugó la última)
  if(!DATA.fechas.length)return [];
  return DATA.jugadores.map(j=>({n:j.n,r:rachaActualDe(j.n)})).filter(x=>x.r>=3).sort((a,b)=>b.r-a.r).slice(0,3);
}
function rachasRotas(){ // venía con racha de 3+ y faltó a la última fecha JUGADA 💔
  const fj=fechasJugadas();
  if(fj.length<2)return [];
  const ult=fj[0], rotas=[];
  DATA.jugadores.forEach(j=>{
    if(ult.parejas.some(t=>t.includes(j.n)))return;
    let r=0; for(const f of fj.slice(1)){ if(f.parejas.some(t=>t.includes(j.n)))r++; else break; }
    if(r>=3)rotas.push({n:j.n,r});

function ratingDe(n){ // rating simple: base por copón + historia (para el pronóstico)
  const ind=statsInd(allFechas())[n]||{camp:0,pala:0,mvp:0};
  const base={A:1200,B:1100,C:1000,D:900}[coponDe(n)]||1050;
  return base+28*(ind.camp||0)-14*(ind.pala||0)+6*(ind.mvp||0);

function probsKia(parejas){ // probabilidad de Kia por pareja (softmax del rating promedio)
  const rs=parejas.map(p=>p.reduce((a,n)=>a+ratingDe(n),0)/p.length);
  const ex=rs.map(r=>Math.exp(r/120));

  return ex.map(e=>Math.max(1,Math.round(e/s*100)));
}

  const m={}, na=nombreActualFn(); // 🔁 renombrados/unidos: el prode guardado con el nombre viejo suma en el de hoy

function duelosDe(name){ // ⚔️ por títulos del día: gano si salí campeón y vos no (jugando ambos)
  const m={};
  allFechas().forEach(f=>{
    if(!f.campeon)return;
    const my=f.parejas.find(p=>p.includes(name)); if(!my)return;
    const yoCamp=f.campeon.includes(name);
    f.parejas.forEach(p=>{ if(p===my)return; p.forEach(riv=>{
      if(esGenerico(riv))return; // "Invitado" no es un rival de verdad
      const o=m[riv]||(m[riv]={w:0,l:0});
      if(yoCamp)o.w++;
      else if(f.campeon.some(x=>p.includes(x)))o.l++;
    });});
  });
  const arr=Object.entries(m).map(([n,v])=>({n,...v}));
  const victima=[...arr].filter(x=>x.w>=2&&x.w>x.l).sort((a,b)=>(b.w-b.l)-(a.w-a.l)||b.w-a.w)[0]; // solo con récord a favor

  DATA.jugadores.forEach(j=>{const r=rachaKiasDe(j.n);if(r>=2)datos.push(`🔥 ${j.n} viene de ganar ${r} fechas seguidas. ¿Nadie lo va a bajar del Kia?`);});
  let nD=0;for(const f of DATA.fechas){if(!f.campeon)continue;if(f.campeon.some(x=>coponDe(x)==="D"))break;nD++;}
  if(nD>=5)datos.push(`🧊 Hace ${nD} fechas con campeón que un copón D no toca el Kia.`);
  const rj=[...arr].sort((a,b)=>(b.nocafe||0)-(a.nocafe||0))[0];
  if(rj&&rj.nocafe>=2)datos.push(`🏃 ${rj.n} ya se rajó ${rj.nocafe} veces sin el café. Los sponsors están preocupados.`);
  const cu=[...arr].sort((a,b)=>(b.pala||0)-(a.pala||0))[0];
  if(cu&&cu.pala>=2)datos.push(`🥄 ${cu.n} lidera el ranking de cucharas con ${cu.pala}. Catador oficial de Blindex.`);
  const ef=[...arr].filter(x=>x.pj>=8).sort((a,b)=>(b.camp/b.pj)-(a.camp/a.pj))[0];
  if(ef&&ef.camp)datos.push(`📈 ${ef.n} tiene la mejor efectividad del grupo: ${Math.round(ef.camp/ef.pj*100)}% de Kias por fecha jugada.`);
  if(!datos.length)return null;
  const week=Math.floor(Date.now()/(7*86400000));
  return datos[week%datos.length];
}
function recuerdoSemanal(){ // 📸 un día como hoy (rota por semana entre fechas con foto)
  const mem=allFechas().filter(f=>f.campeon&&f.fotoKia);
  if(!mem.length)return null;
  const week=Math.floor(Date.now()/(7*86400000));
  const f=mem[week%mem.length];
  const meses=Math.max(1,Math.round((Date.now()-new Date(f.f+"T12:00:00"))/2629800000));
  return {f,meses};
}

/* ---------- 🎾 PARTIDOS A UN SET: lo que se jugó de verdad (el fixture del sorteo es tentativo) ----------
   fecha.partidos=[{n,a,b,ga,gb,fin,por,ts}]: a = la pareja que lo cargó (n = su 1º, 2º… de la mañana), b = el rival, ga/gb = los games de cada una.
   Un set a 6: 6-0…6-4 y 6-5 = se definió en tiebreak 🎯; no existe 6-6 ni 7-x. fin:false = no se terminó (ej. 4-2 por la hora): no cuenta.
   Va aparte del ranking oficial (Kias y fechas): acá solo se suman partidos. */
const PARTIDOS_DESDE="2026-10-11"; // el primer domingo con partidos: a las fechas de antes no se les piden
const PT_CAMPOS=["n","a","b","ga","gb","fin"]; // lo que trae cada partido de una propuesta (las reglas no aceptan más)
const PT_MAX=5; // partidos por pareja en una mañana (de 8:30 a 10 entran 3, a veces un 4º)
function partidoMal(x,deProp){ // "" si es un partido a un set válido; si no, qué tiene de raro (deProp: como viaja en una propuesta, con sus 6 campos justos)
  if(!x||typeof x!=="object"||Array.isArray(x))return "no es un partido";
  if(deProp&&Object.keys(x).some(k=>!PT_CAMPOS.includes(k)))return "trae campos de más";
  const ent=v=>Number.isInteger(v), dos=t=>listaTxt(t,2,2)&&t.every(n=>n.length>0&&n.length<=60&&!n.includes("|")); // como en las reglas: 1 a 60 letras, sin "|"
  if(!ent(x.n)||x.n<1||x.n>10)return "número de partido raro";
  if(!dos(x.a)||!dos(x.b))return "pareja rara";
  if(x.a.some(n=>x.b.includes(n)))return "juega contra su propia pareja";
  if(!ent(x.ga)||!ent(x.gb)||x.ga<0||x.gb<0||x.ga>6||x.gb>6)return "games raros (un set va de 0 a 6)";
  if(typeof x.fin!=="boolean")return "no dice si se terminó";
  if(x.ga===6&&x.gb===6)return "6-6 no existe (6-5 es el tiebreak)";
  if(x.fin!==(x.ga===6||x.gb===6))return x.fin?"dice terminado y nadie llegó a 6":"llegó a 6 y dice que no se terminó";
  if(!deProp&&((x.por!=null&&typeof x.por!=="string")||(x.ts!=null&&typeof x.ts!=="number")))return "quién lo cargó, raro";
  return "";
}
const ptCruce=(x,y)=>(misma(x.a,y.a)&&misma(x.b,y.b))||(misma(x.a,y.b)&&misma(x.b,y.a)); // las mismas dos parejas
const ptIgual=(x,y)=>ptCruce(x,y)&&x.fin===y.fin&&(misma(x.a,y.a)?x.ga===y.ga&&x.gb===y.gb:x.ga===y.gb&&x.gb===y.ga); // el mismo partido aunque lo cargue la otra pareja (resultado espejado)
const ptMismoN=(x,y)=>misma(x.a,y.a)&&x.n===y.n; // el mismo Nº de la misma pareja que lo cargó (su 2º partido es uno solo)
const ptMismo=(x,y)=>ptIgual(x,y)&&(!misma(x.a,y.a)||x.n===y.n); // el MISMO partido: lo cargó la otra pareja, o la misma con el mismo Nº (la misma con otro Nº pudo jugar dos veces: eso se pregunta, no se adivina)
const ptCargo=(f,t)=>partidosFecha(f).some(x=>misma(x.a,t)); // la pareja cargó lo suyo (figurar de rival en lo que cargó otro no alcanza)
function ptHora(ts,f){ const d=new Date(ts); if(typeof ts!=="number"||isNaN(d.getTime()))return ""; const p2=n=>String(n).padStart(2,"0"), iso=d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); return (iso===f?"":diaSem(iso)+" "+d.getDate()+" · ")+p2(d.getHours())+":"+p2(d.getMinutes()); } // "10:20" (o "lun 12 · 20:05" si fue otro día)
function ptDesde(x,P){ const yo=misma(x.a,P); return {el:yo?x.b:x.a,g:yo?x.ga:x.gb,r:yo?x.gb:x.ga,fin:x.fin,propio:yo}; } // visto desde la pareja P (g = sus games)
const ptLimpio=x=>({n:x.n,a:x.a.slice(),b:x.b.slice(),ga:x.ga,gb:x.gb,fin:x.fin}); // los 6 campos (lo que viaja en una propuesta)
const ptTb=(g,r,fin)=>fin&&g+r===11?"🎯":""; // 6-5: se definió en tiebreak
function ptResTxt(g,r,fin){ return fin?`${g>r?"Ganamos":"Perdimos"} ${g}-${r}${ptTb(g,r,fin)}`:`⏱️ ${g}-${r} sin terminar`; }
function ptResHTML(g,r,fin){ return `<b style="white-space:nowrap;color:${!fin?"var(--muted)":g>r?"var(--okT)":"var(--red2)"}">${ptResTxt(g,r,fin)}</b>`; } // verde si ganaron, rojo si perdieron (en un solo renglón)
function ptTxt(x){ return `${x.a.join(" & ")} ${x.ga}-${x.gb}${ptTb(x.ga,x.gb,x.fin)} ${x.b.join(" & ")}${x.fin?"":" (⏱️ sin terminar)"}`; } // texto plano: escapar al usarlo
function partidosFecha(f){ return Array.isArray(f&&f.partidos)?f.partidos.filter(x=>!partidoMal(x)):[]; } // lo raro no se muestra ni suma
function partidosDe(f){ return fechaJugada(f)?partidosFecha(f):[]; } // para las estadísticas: solo fechas ya jugadas (como todo lo demás)
function ptDeLaPareja(f,P){ return P?partidosFecha(f).filter(x=>misma(x.a,P)||misma(x.b,P)):[]; }
function ptPrimera(){ const l=allFechas().filter(f=>partidosFecha(f).length); return l.length?l[l.length-1].f:PARTIDOS_DESDE; } // desde cuándo hay partidos cargados
function statsPartidos(list){ // por jugador: pj = partidos TERMINADOS, g/p, games a favor/en contra, tiebreaks, sin terminar, compañeros y rivales
  const m={}, get=n=>m[n]||(m[n]={n,pj:0,g:0,p:0,gf:0,gc:0,tbg:0,tbp:0,nt:0,comp:{},riv:{}});
  const suma=(s,k,n,gano,g,r)=>{const o=s[k][n]||(s[k][n]={g:0,p:0,gf:0,gc:0});gano?o.g++:o.p++;o.gf+=g;o.gc+=r;};
  (list||DATA.fechas).forEach(f=>partidosDe(f).forEach(x=>[[x.a,x.b,x.ga,x.gb],[x.b,x.a,x.gb,x.ga]].forEach(([yo,el,g,r])=>yo.forEach(n=>{
    if(esGenerico(n))return; const s=get(n); // "Invitado" no se rankea (como en el ranking oficial)
    if(!x.fin){s.nt++;return;}
    const gano=g>r; s.pj++; gano?s.g++:s.p++; s.gf+=g; s.gc+=r; if(g+r===11)gano?s.tbg++:s.tbp++;
    yo.forEach(c=>{if(c!==n&&!esGenerico(c))suma(s,"comp",c,gano,g,r);});
    el.forEach(c=>{if(!esGenerico(c))suma(s,"riv",c,gano,g,r);});
  }))));
  return m;
}
function recordDia(f){ // récord del día por pareja: ganados/perdidos y games de los terminados; los sin terminar, aparte
  const r=[], de=t=>{ let o=r.find(x=>misma(x.t,t)); if(!o)r.push(o={t:f.parejas.find(p=>misma(p,t))||t,g:0,p:0,gf:0,gc:0,nt:0}); return o; };
  partidosFecha(f).forEach(x=>[[x.a,x.ga,x.gb],[x.b,x.gb,x.ga]].forEach(([t,g,c])=>{ const o=de(t); if(!x.fin){o.nt++;return;} g>c?o.g++:o.p++; o.gf+=g; o.gc+=c; }));
  return r.sort((a,b)=>b.g-a.g||a.p-b.p||(b.gf-b.gc)-(a.gf-a.gc)||(b.g+b.p)-(a.g+a.p));
}
function ptDiaDe(f,n){ // 🎾 cómo le fue a un jugador en una fecha: {pj,g,nt,mejor (el triunfo más holgado), peleado (la derrota más ajustada)}
  const t=f.parejas.find(p=>p.includes(n)), l=t?partidosDe(f).filter(x=>misma(x.a,t)||misma(x.b,t)).map(x=>ptDesde(x,t)):[];
  const fin=l.filter(d=>d.fin), g=fin.filter(d=>d.g>d.r);
  return {hay:l.length,pj:fin.length,g:g.length,nt:l.length-fin.length,mejor:g.sort((a,b)=>(b.g-b.r)-(a.g-a.r))[0]||null,peleado:fin.filter(d=>d.g<d.r).sort((a,b)=>(a.r-a.g)-(b.r-b.g))[0]||null};
}
/* ⏳ lo que mandó este celu y el organizador todavía no confirmó (un jugador no puede leer las propuestas): vive en localStorage cb_ptprop
   ({k, uid, f, p = el partido, ts = el de la propuesta, de = el partido cargado que corrige o discute, si es eso}).
   Se va solo cuando aparece en la fecha (confirmado), cuando el organizador ya resolvió esa tanda (algo de ella quedó en la fecha con su ts)
   o a la semana (si no lo confirmó, no queda colgado) */
function ptPendientes(f){
  let l=[]; try{l=JSON.parse(localStorage.getItem("cb_ptprop")||"[]");}catch(e){}
  if(!Array.isArray(l))l=[];
  const ahora=Date.now(), vivas=l.filter(x=>x&&typeof x.f==="string"&&!partidoMal(x.p,true)&&ahora-(+x.ts||0)<7*864e5&&!partidosFecha(DATA.fechas.find(y=>y.f===x.f)).some(y=>ptMismo(y,x.p)||y.ts===x.ts));
  if(vivas.length!==l.length)try{localStorage.setItem("cb_ptprop",JSON.stringify(vivas));}catch(e){}
  const uid=USER?USER.uid:"";
  return vivas.filter(x=>x.uid===uid&&(!f||x.f===f));
}
const ptViejo=x=>Date.now()-(+x.ts||0)>12*36e5; // mandado hace más de 12 horas: si no apareció, lo más probable es que el organizador dejó lo que estaba
function ptRecordar(f,items,ts){ try{ const l=JSON.parse(localStorage.getItem("cb_ptprop")||"[]"); items.forEach((it,i)=>l.push({k:ts+"_"+i,uid:USER?USER.uid:"",f,p:it.p,ts,de:it.de||null})); localStorage.setItem("cb_ptprop",JSON.stringify(l)); }catch(e){} }
function ptOlvidar(k){ try{ const l=JSON.parse(localStorage.getItem("cb_ptprop")||"[]"), fu=typeof k==="function"?k:x=>x.k===k; localStorage.setItem("cb_ptprop",JSON.stringify(l.filter(x=>x&&!fu(x)))); }catch(e){} } // k: la clave o una condición
/* 📝 lo cargado y sin mandar sobrevive a una recarga (pasar a WhatsApp y volver, el login con Google): localStorage cb_ptborrador */
function ptBorradorLeer(f){ try{ const d=JSON.parse(localStorage.getItem("cb_ptborrador")||"null"); return d&&d.f===f.f&&d.fp===JSON.stringify(f.parejas)&&Array.isArray(d.filas)&&Date.now()-(+d.ts||0)<2*864e5&&(!d.uid||!USER||d.uid===USER.uid)?d:null; }catch(e){ return null; } }
function ptBorradorGuardar(){ try{ if(PT&&ptSucio())localStorage.setItem("cb_ptborrador",JSON.stringify({f:PT.f,fp:PT.fp,pi:PT.pi,elegida:PT.elegida,filas:PT.filas,borrar:PT.borrar,uid:USER?USER.uid:"",ts:Date.now()})); else localStorage.removeItem("cb_ptborrador"); }catch(e){} }
function ptBorradorN(f){ // cuántos partidos completos quedaron sin mandar para esa fecha (en pantalla o en el borrador)
  const d=PT&&PT.f===f.f?PT:ptBorradorLeer(f), ok=r=>r&&(r.riv!=null)&&(r.nt?r.sg+r.sr>0:!!r.res);

function ptMio(f){ // 🎾 tu pareja (⭐) en esa fecha y cómo está con sus partidos: cargó (algo cargado por ustedes), mand (⏳ desde este celu), borr (📝 sin mandar)
  const t=MYPLAYER&&f&&Array.isArray(f.parejas)?f.parejas.find(p=>p.includes(MYPLAYER)):null; if(!t||t.length!==2)return null;

function ptBotonTxt(f,falta,gen){ // el botón que lleva a cargar: según cómo está TU pareja (falta = no cargaron nada; gen = sin ⭐ en esa fecha)

async function confirmarPropPartidos(ids){ // ✔️ una o varias propuestas de partidos (de la más vieja a la más nueva): se suman sin duplicar; lo que no coincide se muestra lado a lado

    const mal=propMal(p); if(mal){toast(`⚠️ La de ${porTxt(p)} es inválida (${mal}): descartala con 🗑️`,4500);continue;}

      const x={...ptLimpio(x0),a:x0.a.map(na),b:x0.b.map(na),por:porTxt(p),ts:+p.ts||Date.now()}; // 🔁 renombrados/unidos: con el nombre de hoy
      const pool=antes.filter(y=>!usados.has(y)&&l.includes(y)&&!partidoMal(y));
      const ya=pool.find(y=>ptMismo(y,x)); if(ya){usados.add(ya);c.dup++;continue;} // lo cargó la otra pareja igual (o ya estaba): no se duplica
      const cr=pool.filter(y=>ptCruce(y,x)).sort((a,b)=>ptMismoN(b,x)-ptMismoN(a,x)), ys=cr.length?cr:pool.filter(y=>ptMismoN(y,x)); // primero las mismas parejas; si no hay, el mismo Nº

        usados.add(ys[0]); }

function rachaMaxDe(fechas,n){
  let max=0,cur=0;
  fechasJugadas(fechas).sort((a,b)=>a.f.localeCompare(b.f)).forEach(f=>{
    if(f.parejas.some(t=>t.includes(n))){cur++;if(cur>max)max=cur;}else cur=0;
  });
  return max;
}
function premiosDe(fechas){
  const ind=Object.values(statsInd(fechas));
  const pares=Object.values(statsPar(fechas));
  const top=(arr,k)=>{const s=[...arr].sort((a,b)=>b[k]-a[k])[0];return s&&s[k]?s:null;};
  const p=[];
  const c=top(ind,"camp"); if(c)p.push(["🚗","Campeón del año",`${c.n} (${c.camp} Kia${c.camp===1?"":"s"})`]);
  const quim=[...pares].filter(x=>x.camp).sort((a,b)=>b.camp-a.camp||a.veces-b.veces)[0];
  if(quim)p.push(["💞","Pareja con más química",`${quim.a} & ${quim.b} (${quim.camp} título${quim.camp===1?"":"s"} en ${quim.veces} fecha${quim.veces===1?"":"s"} juntos)`]);
  const m=top(ind,"mvp"); if(m)p.push(["🎖️","MVP del año",`${m.n} (${m.mvp})`]);
  const pj=top(ind,"pj"); if(pj)p.push(["🔥","El más presente",`${pj.n} (${pj.pj} fechas)`]);
  let rn=null,rv=0; ind.forEach(x=>{const r=rachaMaxDe(fechas,x.n);if(r>rv){rv=r;rn=x.n;}});

function buildRounds(teams){ // fixture todos-contra-todos (método del círculo)
  let list=teams.slice(); if(list.length%2)list.push(null);
  const R=Math.max(1,list.length-1), half=list.length/2; let arr=list.slice(); const rounds=[];
  for(let r=0;r<R;r++){
    const ms=[];
    for(let i=0;i<half;i++)ms.push([arr[i],arr[arr.length-1-i]]);
    rounds.push(ms.filter(m=>m[0]||m[1]));
    const fixed=arr[0], rest=arr.slice(1); rest.unshift(rest.pop()); arr=[fixed,...rest];
  }
  return rounds;
}
function seedHash(seedRaw){ let seed=0;for(let i=0;i<seedRaw.length;i++)seed=(seed*31+seedRaw.charCodeAt(i))|0; return seed>>>0; }
function draw(){
  const seedRaw=(document.getElementById("seed").value||"").trim();
  const msg=document.getElementById("drawMsg");
  if(!seedRaw){msg.innerHTML='<span class="warn">Poné un Nº de la suerte.</span>';return;}
  const rnd=mulberry32(seedHash(seedRaw));
  // mismo Nº + mismos presentes = mismas parejas: se ordena antes de repartir el azar (no importa en qué orden se marcaron)
  let all=[...SEL].sort((a,b)=>a<b?-1:a>b?1:0).map(n=>({n,c:coponDe(n),k:rnd()}));
  if(all.length<2){msg.innerHTML='<span class="warn">Marcá al menos 2 jugadores.</span>';document.getElementById("pairsOut").innerHTML="";return;}
  const rk=p=>{const i=p.c?"ABCD".indexOf(p.c):-1;return i>=0?i:1;}; // sin copón declarado = nivel B (ojo: indexOf("") da 0 = A)
  all.sort((a,b)=>rk(a)-rk(b)||a.k-b.k);
  let sup=null;
  if(all.length%2){sup=all.splice(Math.floor(all.length/2),1)[0];}
  // REGLA: el mejor disponible SIEMPRE con el más flojo disponible.
  // Así los A se llevan a los D y C, y los B quedan a lo sumo entre ellos.
  const pool=all.slice(), pairs=[];
  while(pool.length>=2)pairs.push([pool.shift(),pool.pop()]);
  const problemas=pairs.filter(([a,b])=>(a.c==="A"||b.c==="A")&&rk(a)<=1&&rk(b)<=1);
  const orden=shuffle(pairs,rnd); // orden de anuncio
  revelar(orden,{sup,problemas,seedRaw,manual:false});
}
function fechaConParejas(){ // la próxima fecha ya cargada (hoy o futura) con parejas definidas
  const h=new Date(), hoyS=h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0")+"-"+String(h.getDate()).padStart(2,"0");
  const cand=DATA.fechas.filter(f=>f.f>=hoyS&&f.parejas&&f.parejas.length>=2);
  return cand.length?cand[cand.length-1]:null; // la más cercana a hoy
}

  if(typeof p.f!=="string"||!RXFECHA.test(p.f))return "fecha rara";
  if(p.campeon!=null&&!listaTxt(p.campeon,2,3))return "campeón raro";
  if(p.pala!=null&&!listaTxt(p.pala,2,3))return "cuchara rara";
  if(p.mvp!=null&&typeof p.mvp!=="string")return "MVP raro";
  if(p.sinCafe!=null&&!listaTxt(p.sinCafe))return "café raro";
  if(p.partidos!=null){ // 🎾 una propuesta de partidos viene sola (sin campeón/cuchara/MVP/café) y con cada partido válido: lo mismo que piden las reglas
    if(["campeon","pala","mvp","sinCafe"].some(k=>p[k]!=null))return "partidos mezclados con resultado";
    if(!Array.isArray(p.partidos)||!p.partidos.length||p.partidos.length>10)return "partidos raros";
    if(typeof p.por!=="string"||!p.por||p.por.length>200||!Number.isInteger(p.ts))return "quién la mandó o cuándo, raro"; // lo que piden las reglas nuevas (las publicadas hoy aceptan cualquier cosa)

function propNoCoincide(p,fe){ // ¿lo propuesto es de las parejas/jugadores de esa fecha?
  const js=fe.parejas.flat();
  if(p.campeon&&!fe.parejas.some(t=>misma(t,p.campeon)))return "el campeón no es una pareja de esa fecha";
  if(p.pala&&!fe.parejas.some(t=>misma(t,p.pala)))return "la cuchara no es una pareja de esa fecha";
  if(misma(p.campeon||fe.campeon,p.pala||fe.pala))return "el Kia y la cuchara quedarían la misma pareja";
  if(p.mvp&&!js.includes(p.mvp))return "el MVP no jugó esa fecha";
  if(Array.isArray(p.sinCafe)&&!p.sinCafe.every(n=>js.includes(n)))return "en el café hay alguien que no jugó";
  if(Array.isArray(p.partidos)&&!propMal(p)){ const na=nombreActualFn(), es=t=>fe.parejas.some(q=>misma(q,t.map(na)));

}

function fechaMal(f){
  if(!f||typeof f!=="object")return "hay una fecha que no es un objeto";
  if(typeof f.f!=="string"||!RXFECHA.test(f.f))return `hay una fecha con día raro (${String(f.f).slice(0,20)})`;
  if(!Array.isArray(f.parejas)||!f.parejas.every(t=>listaTxt(t,1)))return `la fecha ${f.f} no tiene parejas válidas`;
  if(f.campeon!=null&&f.campeon!==false&&!listaTxt(f.campeon))return `el campeón del ${f.f} es raro`;
  if(f.pala!=null&&f.pala!==false&&!listaTxt(f.pala))return `la cuchara del ${f.f} es rara`;
  if(f.mvp!=null&&f.mvp!==false&&typeof f.mvp!=="string")return `el MVP del ${f.f} es raro`;
  if(f.sinCafe!=null&&f.sinCafe!==false&&!listaTxt(f.sinCafe))return `el café del ${f.f} es raro`; // false = "no se sabe"
  if(f.partidos!=null&&!Array.isArray(f.partidos))return `los partidos del ${f.f} no son una lista`; // uno raro suelto no tira el archivo: no se ve ni suma (se avisa al importar)

}

  if(d.jugadores.some(j=>!j||typeof j.n!=="string"||!j.n.trim()))return "hay un jugador sin nombre";
  for(const f of d.fechas){const m=fechaMal(f);if(m)return m;}
