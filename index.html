function parsePairs(txt,malas){ // malas (opcional): junta las líneas que no son una pareja
  return txt.split("\n").map(cleanLine).filter(l=>l&&!esEncabezado(l)&&!/^parejas/i.test(l)).map(l=>{
    const p=l.split(/\s*(?:,|\/|&|\+|-|–|—)\s*|\s+y\s+/i).map(s=>s.trim()).filter(Boolean).map(s=>matchPlayer(s)||s);
    if(malas&&(p.length<2||p.length>3))malas.push(l);
    return p;
  }).filter(p=>p.length>=2&&p.length<=3);
}
function ultDomingo(){ const d=new Date(); d.setDate(d.getDate()-d.getDay()); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); } // hoy si es domingo (hora local)

/* ================= BIND ================= */
function bind(){
  document.querySelectorAll("[data-foto]").forEach(el=>el.onclick=e=>{e.stopPropagation();verFoto(el.dataset.foto,el.dataset.fototit||"",el.dataset.fotoquien||"");});
  document.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>go(b.dataset.go2));
  document.querySelectorAll("[data-perfil]").forEach(b=>{b.onclick=()=>go("perfil",b.dataset.perfil);
    if(!/^(BUTTON|A)$/.test(b.tagName)){b.setAttribute("role","link");b.tabIndex=0;b.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();b.click();}};}}); // filas enteras tocables (y con teclado)
  document.querySelectorAll("[data-ptgo]").forEach(b=>b.onclick=e=>{e.stopPropagation();go("partidos",b.dataset.ptgo);}); // 🎾 a cargar los partidos de esa fecha
  document.querySelectorAll("[data-ptok],[data-ptokall]").forEach(b=>b.onclick=async()=>{ // ✔️ propuestas de partidos (Inicio y Admin): con un toque
    if(b.dataset.yendo)return; b.dataset.yendo="1"; // doble toque: una sola vez
    try{await confirmarPropPartidos(b.dataset.ptok?[b.dataset.ptok]:propsPartidos().map(p=>p.id));}finally{delete b.dataset.yendo;}
  });
  if(VIEW==="partidos")ptBind();

  if(VIEW==="inicio"){
    // ⏳ cuenta regresiva en vivo
    const tick=()=>{const el=document.getElementById("cdown");if(!el)return;
      const d=proxJuego().d.getTime()-Date.now();
      if(d<=0){el.textContent="🎾 ¡Se juega AHORA!";return;}
      const dd=Math.floor(d/86400000),hh=Math.floor(d%86400000/3600000),mm=Math.floor(d%3600000/60000),ss=Math.floor(d%60000/1000);
      el.textContent=`${dd>0?dd+"d ":""}${hh}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s`;};
    tick();
    clearInterval(window.__cd);window.__cd=setInterval(tick,1000);
    const pd=document.getElementById("parejasDet"); if(pd)pd.ontoggle=()=>{PAR_ABIERTO=pd.open;};
    // 🙋 anotarse / bajarse
    const ab=document.getElementById("asisBtn");
    if(ab)ab.onclick=async()=>{
      const pj=proxJuego();
      const yo=ASIS.find(a=>a.f===pj.f&&a.uid===USER.uid);
      try{
        if(yo){await deleteDoc(doc(db,"asistencia",`${pj.f}_${USER.uid}`));toast("😴 Te bajaste del domingo");}
        else{await setDoc(doc(db,"asistencia",`${pj.f}_${USER.uid}`),{f:pj.f,uid:USER.uid,nombre:(USER.displayName||USER.email||"?").split(" ")[0],jugador:MILINK||null,ts:Date.now()});toast("🙋 ¡Anotado para el domingo!");}
      }catch(e){toast("⚠️ No se pudo (¿reglas actualizadas?)");}
    };
    // 🎲 prode
    const pr=document.getElementById("prodeBtn");
    if(pr)pr.onclick=async()=>{
      const f=DATA.fechas[0]; if(!f||f.campeon)return;
      if(prodeCerrado(f.f)){toast("🔒 El prode cerró a las 8:30 del domingo");render();return;}
      const v=await uiPick("🎲 ¿Quién se lleva el Kia?",`${fmtFecha(f.f)} · elegí tu pareja campeona (podés cambiarlo hasta el domingo a las 8:30)`,
        f.parejas.map((p,i)=>({label:`${i+1}) ${esc(p.join(" & "))} <small>🎯 ${probsKia(f.parejas)[i]}% según la historia</small>`,value:p})));
      if(v===undefined)return;
      if(prodeCerrado(f.f)){toast("🔒 El prode cerró a las 8:30 del domingo");render();return;}
      try{
        await setDoc(doc(db,"prode",`${f.f}_${USER.uid}`),{f:f.f,uid:USER.uid,nombre:(USER.displayName||USER.email||"?").split(" ")[0],jugador:MILINK||null,pareja:v,ts:Date.now()});
        toast("🎲 ¡Pronóstico jugado! Se resuelve el domingo");
      }catch(e){toast("⚠️ No se pudo guardar (¿reglas actualizadas?)");}
    };
    // 👋 desde tu última visita: Listo, ir al resultado / al prode y contarlo en el grupo
    const dvo=document.getElementById("dvOk"); if(dvo)dvo.onclick=()=>{guardarVisto(DV_PEND||estadoVisita());DV_BASE={listo:1};render();};
    const dvh=document.querySelector("[data-dvhero]"), hero=document.querySelector("#app .hero"); if(dvh)dvh.onclick=()=>{if(hero)hero.scrollIntoView({behavior:suave(),block:"start"});};
    const dvp=document.querySelector("[data-dvprode]"), pc=document.getElementById("prodeCard"); if(dvp)dvp.onclick=()=>{if(pc)pc.scrollIntoView({behavior:suave(),block:"start"});};
    const dvt=document.querySelector("[data-dvpt]"), ptd=document.getElementById("ptDia"); if(dvt)dvt.onclick=()=>{if(ptd)ptd.scrollIntoView({behavior:suave(),block:"start"});}; // 🎾 a los partidos del domingo
    const dvq=document.querySelector("[data-dvquien]"); if(dvq)dvq.onclick=()=>{ if(!document.getElementById("uimodal"))quienSoy(); };
    document.querySelectorAll('#desdeVisita [role="link"]').forEach(el=>el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();el.click();}});
    const dsh=document.getElementById("dvShare");
    if(dsh)dsh.onclick=async()=>{ const yo=MYPLAYER, t=`🎾 *Copones BV*\n${(DV_MIO||[]).join("\n")}\n\n👉 Mirá mi perfil: ${linkApp("perfil",yo)}`;
      if(navigator.share){try{await navigator.share({text:t});}catch(e){}} else shareWA(t); };
    // 📊 compartir el dato del lunes
    const ds=document.getElementById("datoShare");
    if(ds)ds.onclick=()=>{const dato=datoSemanal();if(dato)shareWA(`📊 *EL DATO DEL LUNES* · Copones BV\n\n${dato.replace(/<[^>]+>/g,"")}\n\n👉 Toda la data: ${APP_URL}`);};
    const wa=document.getElementById("waShare");
    if(wa)wa.onclick=()=>{
      const f=DATA.fechas.find(x=>x.campeon)||DATA.fechas[0];
      shareWA(textoResultados(f,statsInd()));
    };
    const fb=document.getElementById("flyerBtn");
    if(fb)fb.onclick=()=>{
      const f=DATA.fechas.find(x=>x.campeon)||DATA.fechas[0];
      compartirFlyer(f,statsInd());
    };
    const h2=new Date(), hoy2=h2.getFullYear()+"-"+String(h2.getMonth()+1).padStart(2,"0")+"-"+String(h2.getDate()).padStart(2,"0");
    const fPend=fechaPendiente();   // la última jugada con datos pendientes (la de hoy cuenta desde las 11)
    const fProx=(DATA.fechas[0]&&!DATA.fechas[0].campeon&&DATA.fechas[0].f>=hoy2&&DATA.fechas[0]!==fPend)?DATA.fechas[0]:null;
    const proponer=async f=>{
      if(!f||!faltantesDe(f).length){toast("No hay nada pendiente de cargar");return;}
      if(!USER){toast("Primero ingresá con Google (🔑 arriba)");window.fbLogin();return;}
      const faltan=faltantesDe(f); // solo se pregunta lo que falta
      const dia=fmtFecha(f.f);
      const parejasOpt=f.parejas.map((p,i)=>({label:`${i+1}) ${esc(p.join(" & "))}`,value:p}));
      const jugadores=[...new Set(f.parejas.flat())];
      const prop={f:f.f,por:USER.email,ts:Date.now()};
      let cambios=0;
      if(faltan.includes("campeon")){
        const v=await uiPick("🚗 ¿Quién se llevó el Kia?",`${dia} · tocá la pareja campeona`,[...parejasOpt,{label:"🤷 No sé / no me acuerdo",value:null}]);
        if(v===undefined)return;
        if(v){prop.campeon=v;cambios++;}
      }
      if(faltan.includes("pala")){
        const camp=prop.campeon||f.campeon; // la campeona no puede ser la cuchara
        const v=await uiPick("🥄 ¿Cuchara de madera?",`${dia} · la pareja que la pasó peor`,[...parejasOpt.filter(o=>!misma(o.value,camp)),{label:"🤷 No sé",value:null}]);
        if(v===undefined)return;
        if(v){prop.pala=v;cambios++;}
      }
      if(faltan.includes("mvp")){
        const v=await uiPick("🎖️ ¿MVP del día?",`${dia} · el que la rompió`,[...jugadores.map(n=>({label:esc(n),value:n})),{label:"🤷 No sé",value:null}]);
        if(v===undefined)return;
        if(v){prop.mvp=v;cambios++;}
      }
      if(faltan.includes("cafe")){
        const v=await uiCafe("☕ ¿Quiénes se quedaron al café?",`${dia} · si no sabés, tocá "Dejar como está" (lo demás se manda igual)`,jugadores,[]);
        if(v===undefined)return; // ✕ o atrás: no se manda nada
        if(v!==null){prop.sinCafe=v;cambios++;} // "dejar como está" (no sabe del café): no se inventa, se manda el resto
      }
      if(!cambios){toast("No cargaste ningún dato");return;}
      addDoc(collection(db,"propuestas"),prop)
        .then(()=>toast("📝 ¡Enviado! Le aparece al organizador en su Inicio para confirmarlo"))
        .catch(()=>toast("⚠️ No se pudo enviar (faltan las reglas nuevas)"));
    };
    const pb=document.getElementById("propBtn");
    if(pb)pb.onclick=()=>proponer(fPend);
    const pb2=document.getElementById("propBtn2");
    if(pb2)pb2.onclick=()=>proponer(fProx);
    const lr=document.getElementById("loadResBtn");
    if(lr)lr.onclick=()=>cargarResultado(fPend||DATA.fechas[0]);

        const js=pares.flat(), noVa=e=>["campeon","pala","mvp","sinCafe"].filter(k=>Array.isArray(e[k])?(k==="sinCafe"?!e[k].every(n=>js.includes(n)):!pares.some(t=>misma(t,e[k]))):(k==="mvp"&&typeof e.mvp==="string"&&!js.includes(e.mvp)));
        const pierde=noVa(ex);
        if(!await uiConfirm(`🔁 Ya existe la fecha del ${fmtFecha(f)}`,`Está cargada con:<br><b>${esc(ex.parejas.map(p=>p.join(" & ")).join(" · "))}</b><br><br>¿Reemplazo sus parejas por estas? La fecha no se duplica y lo de ahora queda en el historial de cambios 🕓.${pierde.length?`<br><br>⚠️ Esto no es de las parejas nuevas y queda <b>sin cargar</b> (lo cargás de nuevo enseguida): ${pierde.map(k=>`${NOMDATO[k]} ${esc(valorTxt(k,ex[k]))}`).join(" · ")}`:""}`,"🔁 Reemplazar las parejas","Cancelar"))return;
        ex=DATA.fechas.find(x=>x.f===f); if(!ex){toast(CAMBIO_FECHA,5000);render();return;} // (la nube cambió con el modal abierto y ya no está)
        (ex.versiones||(ex.versiones=[])).push({ts:Date.now(),por:(USER&&USER.email)||"admin (este dispositivo)",antes:{parejas:ex.parejas,...estadoDe(ex)}});
        ex.parejas=pares;
        noVa(ex).forEach(k=>{if(k==="sinCafe")delete ex.sinCafe;else ex[k]=null;}); // el resultado que sigue siendo de estas parejas se conserva
        hecho="reemplazo";
      }else if(!ex){
        DATA.fechas.push({f,parejas:pares,campeon:null,pala:null,mvp:null});
        DATA.fechas.sort((a,b)=>b.f.localeCompare(a.f));
        hecho="nueva";
      }
      if(hecho==="igual")toast(`✓ El ${fmtFecha(f)} ya estaba cargado con esas parejas`);
      else{ if(!await save())return; toast(hecho==="nueva"?"📅 Fecha agregada":"🔁 Parejas reemplazadas — las de antes quedaron en el historial",3500); }
      render();
      const fe=DATA.fechas.find(x=>x.f===f);
      if(fe&&(f<hoyISO()||prodeCerrado(f)))await cargarResultado(fe); // ya se jugó: Kia, cuchara, MVP y café con botones (nada de nombres tipeados)
    };
    // 📸 fotos: elegir → recortar (modal) → publicar en la nube (aparece al instante)
    const fkTipo=document.getElementById("fkTipo");
    if(fkTipo){
      const fkFecha=document.getElementById("fkFecha"), fkJug=document.getElementById("fkJug"),
            fkDel=document.getElementById("fkDel"), wrapF=document.getElementById("fkFechaWrap"), wrapJ=document.getElementById("fkJugWrap");
      const keyAct=()=>fkTipo.value==="perfil"?slugName(fkJug.value):fkFecha.value;
      const slotsAct=()=>fotoSlotIds(fkTipo.value,keyAct()).filter(id=>FOTOS[id]);
      const upd=()=>{
        wrapF.classList.toggle("hidden",fkTipo.value==="perfil");
        wrapJ.classList.toggle("hidden",fkTipo.value!=="perfil");
        const n=slotsAct().length;
        fkDel.classList.toggle("hidden",!n);
        if(n)fkDel.textContent=`🗑️ Sacar la${n===1?"":"s"} ${n===1?"foto publicada":n+" fotos publicadas"} de esta selección`;
      };
      fkTipo.onchange=upd;fkFecha.onchange=upd;fkJug.onchange=upd;upd();
      document.getElementById("fkPub").onclick=async()=>{
        const t=fkTipo.value,k=keyAct();
        const titulo=t==="perfil"?`📸 Foto de perfil de ${fkJug.value}`:`📸 Foto del ${fmtFecha(fkFecha.value)}`;
        const data=await cropFlow(t==="perfil"?"1/1":"3/4",titulo);
        if(!data)return;
        toast("☁️ Publicando…");
        try{await publicarFoto(t,k,data);toast("📸 ¡Publicada! Ya la ven todos en la app");upd();}
        catch(e){
          if(e&&e.message==="lleno")toast("Ya hay 4 fotos acá — sacá alguna con el botón de abajo");
          else explicarReglasFoto(data,k);
        }
      };
      fkDel.onclick=async()=>{
        const ids=slotsAct();
        if(!await uiConfirm("🗑️ ¿Sacar estas fotos?",`Se borra${ids.length===1?" la foto publicada":"n las "+ids.length+" fotos publicadas"} desde la app (si hay alguna subida al repo, vuelve a verse esa).`,"🗑️ Sí"))return;
        try{for(const id of ids){await deleteDoc(doc(db,"fotos",id));delete FOTOS[id];}toast("Fotos borradas");upd();render();}catch(e){toast("⚠️ No se pudo borrar");}
      };
    }
    // los botones de cada fila se atan a SU fecha/jugador (el de esta pantalla): si la nube cambia antes del toque, se busca por clave
    document.querySelectorAll("[data-delf]").forEach(b=>{const f=DATA.fechas[+b.dataset.delf]; b.onclick=async()=>{
      if(!f)return;
      if(!await uiConfirm("🗑️ ¿Borrar esta fecha?",`La del <b>${fmtFecha(f.f)}</b> (${f.parejas.length} parejas). Esto no se puede deshacer.`,"🗑️ Sí, borrala"))return;
      const k=JSON.stringify(f), i=DATA.fechas.findIndex(x=>x===f||JSON.stringify(x)===k); // exactamente la que viste
      if(i<0){toast("⚠️ Esa fecha cambió en la nube mientras preguntaba: no se borró nada. Revisala",4500);render();return;}
      DATA.fechas.splice(i,1);save();render();
    };});
    document.querySelectorAll("[data-editcamp]").forEach(b=>{const f=DATA.fechas[+b.dataset.editcamp]; b.onclick=()=>cargarResultado(fechaActual(f)||f);});
    document.querySelectorAll("[data-hist]").forEach(b=>{const f0=DATA.fechas[+b.dataset.hist]; b.onclick=()=>{
      const f=fechaActual(f0)||f0; if(!f||!f.versiones)return;
      const lineas=[...f.versiones].reverse().map(v=>{
        const d=new Date(v.ts), t=`${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        const a=v.antes||{}, partes=[];
        if(Array.isArray(a.parejas))partes.push(`👥 ${esc(a.parejas.map(p=>p.join(" & ")).join(" · "))}`);
        const res=["campeon","pala","mvp","sinCafe"].filter(k=>k in a).map(k=>`${NOMDATO[k].split(" ")[0]} ${esc(valorTxt(k,a[k]))}`); // solo lo que guardó esa versión (un reemplazo de parejas no trae resultado)
        if(res.length)partes.push(res.join(" · "));
        if(Array.isArray(a.partidos))partes.push(`🎾 ${a.partidos.length===1?"1 partido":a.partidos.length+" partidos"}${a.partidos.length?": "+a.partidos.filter(x=>!partidoMal(x)).map(x=>esc(ptTxt(x))).join(" · "):""}`); // 🎾 cómo estaban los partidos antes de corregirlos
        return `<div class="mopt" style="cursor:default"><b>${t}</b> · lo cambió ${esc(v.por)}<small>Decía: ${partes.join("<br>")||"—"}</small></div>`;
      });
      const d=uiShow(`🕰️ Historial de cambios`,`Fecha del ${fmtFecha(f.f)} · la versión vigente es la que se ve en la app`,lineas.join("")+`<button class="mcancel" data-x>Cerrar</button>`);
      d.querySelector("[data-x]").onclick=uiClose;
      d.onclick=e=>{if(e.target===d)uiClose();};
    };});
    document.querySelectorAll("[data-cop]").forEach(s=>{const n=(DATA.jugadores[+s.dataset.cop]||{}).n; s.onchange=()=>{
      const j=DATA.jugadores.find(x=>x.n===n); if(!j){toast("Ese jugador ya no está en el plantel");render();return;}
      j.c=s.value;save();
    };});
    document.querySelectorAll("[data-delj]").forEach(b=>{const n=(DATA.jugadores[+b.dataset.delj]||{}).n; b.onclick=async()=>{
      if(!n)return;
      if(!await uiConfirm(`🗑️ ¿Sacar a ${esc(n)} del plantel?`,"Su historial de fechas no se borra: va a aparecer como jugador sorpresa.","🗑️ Sí, sacalo"))return;
      const i=DATA.jugadores.findIndex(x=>x.n===n); if(i<0){toast("Ese jugador ya no estaba en el plantel");render();return;}
      DATA.jugadores.splice(i,1);save();render();
    };});
    document.getElementById("addj").onclick=()=>{const v=document.getElementById("newj").value.trim();if(!v)return;if(nombreMal(v)){toast(nombreMal(v),4000);return;}DATA.jugadores.push({n:v,c:""});save();render();};
    document.getElementById("expData").onclick=()=>{descargarJSON(JSON.stringify(DATA,null,2),"copones-datos.json");toast("Datos exportados ✓");};
    document.getElementById("copyData").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(DATA,null,2));toast("Datos copiados");}catch(e){toast("No se pudo copiar");}};
    document.getElementById("impData").onclick=()=>document.getElementById("impFile").click();
    document.getElementById("impFile").onchange=e=>{const file=e.target.files[0];e.target.value="";if(!file)return;const r=new FileReader();r.onload=()=>importarDatos(r.result);r.readAsText(file);};
  }
}

/* ================= INIT ================= */
(function init(){
  if(!location.hash)try{const v=sessionStorage.getItem("cb_volver");if(v&&v.length>1){history.replaceState(history.state,"",v);HASH_VISTO=v;}}catch(e){} // 🔗 volvió del login de Google sin el #: a la sección del link
  const h=location.hash.slice(1);
  if(h){const [v,p]=h.split("=");VIEW=v||"inicio";PARAM=p?decodeURIComponent(p):null;}
  if(history.state&&history.state.ov)try{history.replaceState(null,"");}catch(e){} // recargó con un modal abierto: esa entrada ya no tiene modal
  marcarNav();
  // tema claro/oscuro
  const applyTheme=t=>{document.body.classList.toggle("light",t==="light");document.getElementById("themeBtn").textContent=t==="light"?"☀️":"🌙";};
  let theme="dark"; try{theme=localStorage.getItem("cb_theme")||"dark";}catch(e){}
  applyTheme(theme);
  document.getElementById("themeBtn").onclick=()=>{theme=theme==="light"?"dark":"light";try{localStorage.setItem("cb_theme",theme);}catch(e){}applyTheme(theme);};
  renderAuth();
  render();
})();
</script>
